<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《岳陽樓記》大闖關之你有認真上課嗎？</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --accent-color: #d69e2e;
            --correct-color: #38a169;
            --wrong-color: #e53e3e;
            --bg-color: #edf2f7;
        }

        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 850px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            padding: 30px;
            box-sizing: border-box;
            border: 3px solid var(--primary-color);
        }

        .header {
            text-align: center;
            border-bottom: 3px solid var(--secondary-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 28px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 20px;
            background-color: #e2e8f0;
            padding: 10px 20px;
            border-radius: 8px;
        }

        .question-box {
            font-size: 20px;
            color: #2d3748;
            margin-bottom: 25px;
            line-height: 1.6;
            background-color: #f7fafc;
            padding: 15px;
            border-left: 5px solid var(--secondary-color);
            border-radius: 4px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #ffffff;
            border: 2px solid var(--secondary-color);
            color: var(--primary-color);
            padding: 15px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            font-weight: bold;
        }

        .option-btn:hover {
            background-color: var(--secondary-color);
            color: #ffffff;
        }

        .option-btn.correct {
            background-color: var(--correct-color) !important;
            color: #ffffff !important;
            border-color: var(--correct-color) !important;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color) !important;
            color: #ffffff !important;
            border-color: var(--wrong-color) !important;
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            display: none;
            line-height: 1.5;
        }

        .explanation.show {
            display: block;
            background-color: #feebc8;
            border: 1px solid var(--accent-color);
            color: #744210;
        }

        .next-btn {
            display: none;
            width: 100%;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }

        .next-btn:hover {
            background-color: #b7791f;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-screen h2 {
            color: var(--primary-color);
            font-size: 32px;
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 48px;
            color: var(--accent-color);
            font-weight: bold;
            margin: 20px 0;
        }

        .restart-btn {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .restart-btn:hover {
            background-color: var(--secondary-color);
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h1>🏯《岳陽樓記》大闖關之你有認真上課嗎？</h1>
    </div>

    <div id="quiz-screen">
        <div class="status-bar">
            <span>第 <span id="current-q">1</span> / 20 題</span>
            <span>得分：<span id="score">0</span> / 100</span>
        </div>

        <div class="question-box" id="question">題目載入中...</div>

        <div class="options-grid" id="options"></div>

        <div class="explanation" id="explanation"></div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">下一題 ➔</button>
    </div>

    <div class="result-screen" id="result-screen">
        <h2>🎉 挑戰完成！</h2>
        <p style="font-size: 20px; color: #4a5568;">你完成了《岳陽樓記》隨機20題大考驗！</p>
        <div class="score-display"><span id="final-score">0</span> 分</div>
        <p id="feedback-msg" style="font-size: 18px; margin-bottom: 25px;"></p>
        <button class="restart-btn" onclick="restartGame()">再抽 20 題挑戰 🔄</button>
    </div>
</div>

<script>
    const fullBank = [];

    function addQ(q, o, a, e) {
        fullBank.push({ question: q, options: o, answer: a, explanation: e });
    }

    // --- 150題庫資料（根據 答案.pdf 全冊建立） ---
    // --- 一、結構填空與段旨（題目 1 - 25） ---
    addQ("【課文結構】滕子京調守巴陵郡第二年，當地政事順利，百姓（ ）。", ["豐衣足食", "安居樂業", "歌舞升平", "百廢待興"], 1, "課文結構：政事順利，百姓安居樂業。");
    addQ("【課文結構】滕子京重修岳陽樓後，把唐代著名文人和（ ）寫的詩賦刻在上面。", ["前代聖賢", "當代人", "宋代名家", "歷代官員"], 1, "課文結構：刻唐賢今人詩賦於其上。");
    addQ("【課文結構】滕子京重修岳陽樓後，囑託誰寫一篇文章來記敍這件事？", ["蘇軾", "范仲淹", "歐陽修", "韓愈"], 1, "課文結構：囑託范仲淹寫文章記敍。");
    addQ("【課文結構】巴陵郡的美景，全部集中在哪裏？", ["巴山", "洞庭湖", "巫峽", "瀟湘"], 1, "課文結構：巴陵郡的美景，全在洞庭湖上。");
    addQ("【課文結構】洞庭湖景色千變萬化，文中提到早晨晴朗，傍晚如何？", ["昏暗", "陰暗", "蕭瑟", "模糊"], 1, "課文結構：朝暉夕陰（早晨晴朗，傍晚陰暗）。");
    addQ("【課文結構】洞庭湖地理位置優越，向北可以通到哪裏？", ["瀟水", "巫峽", "湘江", "長江"], 1, "課文結構：北通巫峽。");
    addQ("【課文結構】洞庭湖向南可以通到瀟水和哪條河流？", ["珠江", "湘江", "漢江", "贛江"], 1, "課文結構：南極瀟湘（瀟水和湘江）。");
    addQ("【課文結構】多會於岳陽樓的人，除了往來詩人外，還有哪類人？", ["富商大賈", "被降職遠調／貶遷的官吏", "朝廷使臣", "隱逸高士"], 1, "課文結構：遷客騷人（被降職遠調／貶遷的官吏和往來詩人）。");
    addQ("【課文結構】陰天時，岳陽樓景色「日星隱耀」，高山表現為如何？", ["雲霧繚繞", "隱藏不見", "連綿不斷", "聳立雲霄"], 1, "課文結構：山岳潛形（高山也隱藏不見）。");
    addQ("【課文結構】陰天黃昏天色昏暗時，景物描寫包含了老虎怒吼和甚麽？", ["杜鵑啼血", "猿猴悲啼", "飛鳥驚起", "狂風暴雨"], 1, "課文結構：虎嘯猿啼。");
    addQ("【課文結構】陰天登樓者會產生悲傷情緒，擔心被人誹謗或甚麽？", ["排擠", "譏諷", "陷害", "疏遠"], 1, "課文結構：憂讒畏譏（擔心被人誹謗或譏諷）。");
    addQ("【課文結構】晴天時，湖面「波瀾不驚」，天色和湖光連成一片甚麽顏色？", ["蔚藍", "碧綠", "湛藍", "翠綠"], 1, "課文結構：一碧萬頃（連成一片碧綠）。");
    addQ("【課文結構】晴天時，岸邊或小洲上的香草和蘭花香氣如何？", ["撲鼻", "濃郁", "清淡", "幽香"], 1, "課文結構：岸芷汀蘭，郁郁青青（香氣濃郁，色澤茂盛）。");
    addQ("【課文結構】晴天月夜，湖面「靜影沉璧」，「沉璧」將月影比喻為甚麽？", ["明珠", "璧玉", "白銀", "水晶"], 1, "課文結構：靜影沉璧（明月映入湖水倒影猶如璧玉）。");
    addQ("【課文結構】晴天登樓者心曠神怡，把甚麽全部忘記？", ["功名", "榮辱", "恩怨", "憂愁"], 1, "課文結構：寵辱偕忘（把榮辱全部忘記）。");
    addQ("【課文結構】「古仁人」不會因為美好的事物高興，也不會為甚麽而悲傷？", ["國家的動蕩", "自己的不幸", "朋友的離別", "時光的流逝"], 1, "課文結構：不以物喜，不以己悲（不為自己不幸而悲傷）。");
    addQ("【課文結構】「古仁人」身處朝廷做官時，會擔心甚麽？", ["君主", "百姓", "邊防", "社稷"], 1, "課文結構：居廟堂之高，則憂其民。");
    addQ("【課文結構】「古仁人」身處民間（江湖之遠）時，會擔心甚麽？", ["百姓", "君主", "生計", "國家"], 1, "課文結構：處江湖之遠，則憂其君。");
    addQ("【課文結構】范仲淹的政治理想是「先天下之憂而憂，（ ）」。", ["後天下之憂而憂", "後天下之樂而樂", "獨樂樂不如眾樂樂", "與民同樂"], 1, "課文結構：先天下之憂而憂，後天下之樂而樂。");
    addQ("【段旨分析】文章首段指出作記之因由，文中哪個詞是本文眼目，有憂君之意？", ["具興", "謫守", "勝狀", "重修"], 1, "段旨分析：『謫守』二字是本文眼目，有憂君之意。");
    addQ("【段旨分析】首段中「政通人和，百廢具興」這兩句起到甚麽作用？", ["承上啟下", "點題之效", "總領全文", "伏筆"], 1, "段旨分析：『政通』二句有點題之效。");
    addQ("【段旨分析】第二段「遷客騷人」在語意上暗指首段的哪兩個字？", ["重修", "謫守", "作文", "勝狀"], 1, "段旨分析：『遷客騷人』暗指『謫守』二字。");
    addQ("【段旨分析】第三段談覽物而悲者，收結了憂己之情，開啟下段甚麽感情？", ["喜洋洋之情", "憂君憂民之情", "悲帝王之情", "思鄉之情"], 1, "段旨分析：收結憂己之情，開啟下段憂君憂民之情。");
    addQ("【段旨分析】第四段談覽物而喜者，其主要作用是用來反襯誰被貶？", ["范仲淹", "滕子京", "白居易", "歐陽修"], 1, "段旨分析：反襯滕子京被貶。");
    addQ("【段旨分析】第五段以甚麽作為主旨作結？", ["不以物喜，不以己悲", "先天下之憂而憂，後天下之樂而樂", "微斯人，吾誰與歸", "政通人和，百廢具興"], 1, "段旨分析：以『先天下之憂而憂，後天下之樂而樂』為主旨作結。");

    // --- 二、結構作用與寫作手法（題目 26 - 40） ---
    addQ("【結構作用】首段「屬予作文以記之」直接寫出寫作動機，其結構作用是甚麽？", ["承上啟下", "引入下文", "首尾呼應", "總結全文"], 1, "結構作用：引入下文。");
    addQ("【結構作用】第二段「覽物之情，得無異乎？」在結構上起到甚麽作用？", ["引入下文", "承上啟下", "首尾呼應", "鋪墊"], 1, "結構作用：承上啟下。");
    addQ("【結構作用】「覽物之情，得無異乎？」中的「承上」是指承接甚麽內容？", ["滕子京重修岳陽樓", "在岳陽樓看到的景色", "遷客騷人的悲傷", "古仁人之心"], 1, "結構作用：承上：在岳陽樓看到的景色。");
    addQ("【結構作用】「覽物之情，得無異乎？」中的「啟下」是指開啟甚麽內容？", ["寫古仁人之心", "寫遷客騷人因景而生之情", "寫重修岳陽樓經過", "寫洞庭湖地理"], 1, "結構作用：啟下：寫遷客騷人因景而生之情。");
    addQ("【結構作用】第三、四段在結構上呼應了第二段的哪一句話？", ["予觀夫巴陵勝狀", "覽物之情，得無異乎？", "前人之述備矣", "此則岳陽樓之大觀也"], 1, "結構作用：第三、四段呼應了第二段『覽物之情，得無異乎？』。");
    addQ("【結構作用】第五段「或異二者之為」中的「二者」是指甚麽？", ["陰天與晴天", "悲者與喜者（遷客騷人）", "滕子京與范仲淹", "朝廷與江湖"], 1, "結構作用：『二者』指上兩段所說的遷客騷人。");
    addQ("【結構作用】第五段以設問句「何哉？」在結構上起到甚麽作用？", ["承上：總結遷客騷人", "啟下：抒寫古仁人之心特質", "首尾呼應", "點明主旨"], 1, "結構作用：開啟下文抒寫『古仁人之心』的特質。");
    addQ("【結構作用】末段「處江湖之遠，則憂其君」在結構上呼應了開首的哪句內容？", ["政通人和", "謫守巴陵郡", "百廢具興", "屬予作文"], 1, "結構作用：呼應文章開首指滕子京『謫守巴陵郡』。");
    addQ("【多感官描寫】「虎嘯猿啼」屬於甚麽感官描寫？其作用是甚麽？", ["視覺；描寫景色宏偉", "聽覺；渲染陰雨天蕭瑟氣氛", "嗅覺；表現空氣清新", "味覺；表現孤苦"], 1, "多感官描寫：聽覺，渲染了陰雨天時岳陽樓的蕭瑟氣氛。");
    addQ("【多感官描寫】「濁浪排空，日星隱耀」運用了甚麽感官描寫和修辭手法？", ["聽覺與比喻", "視覺與誇張", "嗅覺與對比", "味覺與擬人"], 1, "多感官描寫：視覺，用誇張的手法突顯天氣惡劣。");
    addQ("【多感官描寫】「岸芷汀蘭，郁郁青青」屬於甚麽感官描寫？", ["視覺", "嗅覺", "聽覺", "觸覺"], 1, "多感官描寫：嗅覺（郁郁形容香氣濃郁）。");
    addQ("【寫作手法】「浮光躍金」屬於甚麽描寫手法？描寫甚麽景象？", ["靜態描寫；平靜湖水", "動態描寫；月光映照湖面光芒", "間接描寫；漁夫捕魚", "側面積累；晴朗天空"], 1, "動態描寫：以『浮光躍金』描寫月亮映照湖面的光芒。");
    addQ("【寫作手法】「長煙一空，皓月千里；靜影沉璧」屬於甚麽描寫手法？", ["動態描寫", "靜態描寫", "間接描寫", "社會描寫"], 1, "靜態描寫：描寫清朗月夜與靜止湖水倒影。");
    addQ("【寫作手法】「春和景明，波瀾不驚，上下天光，一碧萬頃」屬於甚麽描寫？", ["間接描寫", "直接描寫", "側描寫", "虛寫"], 1, "直接描寫：直接描寫岳陽樓風和日麗時天朗氣清的景象。");
    addQ("【寫作手法】「商旅不行，檣傾楫摧」屬於甚麽描寫？其作用是甚麽？", ["直接描寫；寫船隻破舊", "間接描寫；突顯天氣惡劣", "動態描寫；寫商人忙碌", "心理描寫；寫恐懼"], 1, "間接描寫：以商旅無法行走、船傾倒，間接描寫天氣惡劣。");

    // --- 三、對比手法（題目 41 - 50） ---
    addQ("【對比手法】文中寫陰天與晴天登樓者的感情對比是甚麽？", ["憂國憂民 VS 獨善其身", "因雨而悲 VS 因晴而喜", "樂極生悲 VS 破鏡重圓", "先憂後樂 VS 先樂後憂"], 1, "對比：感情上『因雨而悲 VS 因晴而喜』。");
    addQ("【對比手法】文中氣候特徵的對比，陰天是「霪雨霏霏，陰風怒號」，晴天是甚麽？", ["上下天光", "春和景明", "長煙一空", "皓月千里"], 1, "對比：氣候『霪雨霏霏、陰風怒號、薄暮冥冥 VS 春和景明』。");
    addQ("【對比手法】文中光線變化的對比，陰天是「連月不開，日星隱耀」，晴天是甚麽？", ["波瀾不驚", "上下天光", "浮光躍金", "靜影沉璧"], 1, "對比：光線『連月不開、日星隱耀、山岳潛形 VS 上下天光』。");
    addQ("【對比手法】文中湖面狀態的對比，陰天是「濁浪排空」，晴天是甚麽？", ["靜影沉璧", "波瀾不驚，一碧萬頃", "皓月千里", "漁歌互答"], 1, "對比：湖面『濁浪排空 VS 波瀾不驚、一碧萬頃』。");
    addQ("【對比手法】文中人物活動的對比，陰天是「商旅不行，檣傾楫摧」，晴天是甚麽？", ["錦鱗游泳", "漁歌互答，此樂何極", "把酒臨風", "沙鷗翔集"], 1, "對比：人物活動『商旅不行，檣傾楫摧 VS 漁歌互答，此樂何極』。");

    addQ("【名言警句】體現古仁人曠達胸懷、不為外物動搖的警句是甚麽？", ["居廟堂之高，則憂其民", "不以物喜，不以己悲", "先天下之憂而憂", "微斯人，吾誰與歸"], 1, "名言：「不以物喜，不以己悲。」");
    addQ("【名言警句】「居廟堂之高，則憂其民；處江湖之遠，（ ）」。", ["則憂其民", "則憂其君", "後天下之樂而樂", "則憂其國"], 1, "名言：「居廟堂之高，則憂其民；處江湖之遠，則憂其君。」");
    addQ("【名言警句】范仲淹表達遠大政治抱負的核心名句是甚麽？", ["寵辱偕忘，把酒臨風", "先天下之憂而憂，後天下之樂而樂", "微斯人，吾誰與歸", "政通人和，百廢具興"], 1, "名言：「先天下之憂而憂，後天下之樂而樂。」");
    addQ("【課文知識】文中哪一句話表明了范仲淹對滕子京的安慰與互相勉勵之意？", ["不以物喜，不以己悲", "微斯人，吾誰與歸", "此樂何極", "刻唐賢今人詩賦於其上"], 1, "名言：「微斯人，吾誰與歸？」（如果沒有這樣的人，我同誰一道呢？）");
    addQ("【體裁知識】古代「記」的範圍廣泛，下列哪一篇作品不屬於山水遊記？", ["柳宗元《至小丘西小石潭記》", "陶潛《桃花源記》", "蘇軾《記承天寺夜遊》", "張岱《湖心亭看雪》"], 1, "體裁知識：《桃花源記》通過虛構故事寄托嚮往；其餘三篇為山水遊記。");
    addQ("【學習重點】范仲淹寫作《岳陽樓記》的最主要目的不包括下列哪一項？", ["應好友滕子京之囑託作記", "宣傳岳陽樓風景以吸引旅客", "抒發自己『先憂後樂』的政治抱負", "勉勵滕子京學習古仁人曠達襟懷"], 1, "重點：范仲淹作記旨在應邀、抒懷及規勸勉勵朋友，非宣傳景點。");
    addQ("【課文結構】洞庭湖晴天時，晚上「長煙一空，皓月千里」，湖面上「浮光躍金」形容甚麽？", ["漁火閃爍", "月亮映照湖面的金色光芒", "水中金魚游泳", "岸上燈火"], 1, "結構：『浮光躍金』指波浪起伏時月光映照在湖面上像金子跳躍。");
    addQ("【綜合知識】「寵辱偕忘」中的「偕」字解作甚麽？", ["和階", "一起／全", "偶爾", "重新"], 1, "知識：偕解作『一起』或『全』。");
    addQ("【綜合知識】「沙鷗翔集，錦鱗游泳」中的「集」字解作甚麽？", ["聚集", "停息（鳥停在樹／洲上）", "集市", "集合"], 1, "知識：集古義指『鳥停息』。");
    addQ("【綜合知識】「把酒臨風」中的「把」字解作甚麽？", ["把持", "端起／拿着", "把玩", "介詞"], 1, "知識：把解作『端起/拿着』。");

    // 遊戲狀態變量
    let selectedQuestions = [];
    let currentQIndex = 0;
    let score = 0;
    let canAnswer = true;

    // 洗牌算法（Fisher-Yates Shuffle）
    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        const newArray = [...array];
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
        }
        return newArray;
    }

    // 初始化/開始遊戲（隨機抽20題，並隨機打亂每題的選項）
    function initGame() {
        const shuffledBank = shuffle(fullBank);
        const raw20 = shuffledBank.slice(0, 20);

        // 對抽取出來的20題進行「選項打亂與答案動態修正」
        selectedQuestions = raw20.map(q => {
            const correctAnswerText = q.options[q.answer]; // 獲取正確答案文字
            const shuffledOptions = shuffle(q.options);    // 打亂選項順序
            const newCorrectAnswerIndex = shuffledOptions.indexOf(correctAnswerText); // 找出新的正確答案索引

            return {
                question: q.question,
                options: shuffledOptions,
                answer: newCorrectAnswerIndex,
                explanation: q.explanation,
                correctText: correctAnswerText
            };
        });

        currentQIndex = 0;
        score = 0;
        document.getElementById('score').textContent = 0;
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';

        loadQuestion();
    }

    function loadQuestion() {
        canAnswer = true;
        const q = selectedQuestions[currentQIndex];

        document.getElementById('current-q').textContent = currentQIndex + 1;
        document.getElementById('question').textContent = q.question;

        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';

        const prefixes = ["A", "B", "C", "D"];

        q.options.forEach((optText, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = `${prefixes[index]}. ${optText}`;
            btn.onclick = () => checkAnswer(index, btn);
            optionsContainer.appendChild(btn);
        });

        document.getElementById('explanation').classList.remove('show');
        document.getElementById('next-btn').style.display = 'none';
    }

    function checkAnswer(selectedIndex, btn) {
        if (!canAnswer) return;
        canAnswer = false;

        const q = selectedQuestions[currentQIndex];
        const buttons = document.querySelectorAll('.option-btn');
        const prefixes = ["A", "B", "C", "D"];

        if (selectedIndex === q.answer) {
            btn.classList.add('correct');
            score += 5; // 每題 5 分
            document.getElementById('score').textContent = score;
        } else {
            btn.classList.add('wrong');
            buttons[q.answer].classList.add('correct');
        }

        const expBox = document.getElementById('explanation');
        expBox.textContent = `【答案：${prefixes[q.answer]}. ${q.correctText}】${q.explanation}`;
        expBox.classList.add('show');

        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQIndex++;
        if (currentQIndex < selectedQuestions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').textContent = score;

        let msg = "";
        if (score === 100) {
            msg = "🏆 太完美的表現！你對《岳陽樓記》的理解達到『古仁人』境界！";
        } else if (score >= 80) {
            msg = "🌟 優秀！文言基礎非常紮實，繼續保持！";
        } else if (score >= 60) {
            msg = "👍 合格！掌握了大部分核心內容，多加練習會更棒！";
        } else {
            msg = "📚 仍需努力！建議重溫導學筆記，再次抽題挑戰！";
        }
        document.getElementById('feedback-msg').textContent = msg;
    }

    function restartGame() {
        initGame();
    }

    // 頁面載入後自動啟動
    window.onload = initGame;
</script>
